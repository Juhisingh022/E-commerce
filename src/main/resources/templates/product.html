
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base:: Layout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCart Products</title>
</head>

<body>
<section style="background:#050607; min-height:100vh; color:white; padding-bottom:50px;">

    <!-- SEARCH -->
    <div class="container-fluid px-3 px-md-5 mt-4"
         style="padding-top:35px !important;">

        <div class="row shadow p-3 mb-4 rounded"
             style="background:#101314; border:1px solid #292d2f;
                    border-radius:15px !important;">

            <div class="col-12 col-lg-8 offset-lg-2">
                <form th:action="@{/products}" method="get">
                    <input type="hidden" name="category" th:value="${category}">

                    <div class="input-group">
                        <input type="text" class="form-control"
                               name="ch" th:value="${searchQuery}"
                               placeholder="Search products..."
                               style="background:#080a0b; color:white;
                                      border:1px solid #353839; padding:12px;">

                        <button type="submit" class="btn ms-2"
                                style="background:#7CFF4F; color:#050607;
                                       border-radius:8px; font-weight:600;">
                            <i class="fa-solid fa-magnifying-glass"></i> Search
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- PRODUCTS AND CATEGORIES -->
    <div class="container-fluid px-3 px-md-4">
        <div class="row g-3">

            <!-- CATEGORY SIDEBAR -->
            <div class="col-12 col-md-4 col-lg-3 col-xl-2">

                <div class="category-panel p-3">
                    <h5 class="mb-3" style="color:#7CFF4F;">Categories</h5>

                    <div class="list-group">
                        <a th:href="@{/products}"
                           class="list-group-item category-link">
                            All Products
                        </a>

                        <a th:href="@{/products(category='Baby Clothes')}"
                           class="list-group-item category-link">
                            Baby Clothes
                        </a>

                        <a th:href="@{/products(category='Gifts')}"
                           class="list-group-item category-link">
                            Gifts
                        </a>

                        <a th:href="@{/products(category='Foot Wear')}"
                           class="list-group-item category-link">
                            Foot Wear
                        </a>

                        <a th:href="@{/products(category='Accessary')}"
                           class="list-group-item category-link">
                            Accessories
                        </a>

                        <a th:href="@{/products(category='Bags')}"
                           class="list-group-item category-link">
                            Bags
                        </a>

                        <a th:href="@{/products(category='Home Decore items')}"
                           class="list-group-item category-link">
                            Home Decor
                        </a>

                        <a th:href="@{/products(category='Watches')}"
                           class="list-group-item category-link">
                            Watches
                        </a>

                        <a th:href="@{/products(category='Study Materials')}"
                           class="list-group-item category-link">
                            Study Materials
                        </a>

                        <a th:href="@{/products(category='Electronics')}"
                           class="list-group-item category-link">
                            Electronics
                        </a>

                        <a th:href="@{/products(category='Phones')}"
                           class="list-group-item category-link">
                            Mobile Phones
                        </a>
                    </div>
                </div>
            </div>

            <!-- PRODUCT GRID -->
            <div class="col-12 col-md-8 col-lg-9 col-xl-10">

                <div class="products-panel p-2 p-md-4">

                    <h3 class="text-center mb-4"
                        style="color:white; font-weight:600;">

                        <span style="color:#7CFF4F;">✦ </span>
                        <span th:if="${#strings.isEmpty(category)}">All Products</span>
                        <span th:unless="${#strings.isEmpty(category)}"
                              th:text="${category}"></span>
                        <span style="color:#7CFF4F;"> ✦</span>
                    </h3>

                    <div class="row g-3">

                        <!-- PRODUCT CARD -->
                        <div class="col-6 col-lg-4 col-xl-3"
                             th:each="item : ${products}">

                            <div class="product-card h-100 p-2 p-md-3">

                                <img class="product-image"
                                     th:src="${item.image}"
                                     th:alt="${item.name}"
                                     loading="lazy">

                                <div class="d-flex flex-column flex-grow-1">
                                    <h6 class="product-name mt-3"
                                        th:text="${item.name}">
                                    </h6>

                                    <p class="product-price mt-2">
                                        ₹<span th:text="${item.price}"></span>
                                        <span class="discount"
                                              th:text="${item.discount}">
                                        </span>
                                    </p>

                                    <a th:href="@{/view_product(name=${item.name})}"
                                       class="btn view-btn mt-auto">
                                        View Details
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- NO PRODUCTS -->
                        <div class="col-12 text-center py-5"
                             th:if="${#lists.isEmpty(products)}">

                            <i class="fa-solid fa-box-open fa-3x mb-3"
                               style="color:#7CFF4F;"></i>

                            <h4>No products found</h4>
                            <p style="color:#b8b8b8;">
                                Try another search or category.
                            </p>

                            <a th:href="@{/products}" class="btn view-btn">
                                View All Products
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .category-panel,
        .products-panel {
            background: #101314;
            border: 1px solid #292d2f;
            border-radius: 14px;
        }

        .category-link {
            background: #101314;
            color: #e0e0e0;
            border: 1px solid #292d2f;
            border-radius: 7px !important;
            margin-bottom: 5px;
            transition: all .25s ease;
        }

        .category-link:hover {
            background: #171d17;
            color: #7CFF4F;
            border-color: #7CFF4F;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            background: #101314;
            border: 1px solid #292d2f;
            border-radius: 14px;
            transition: all .3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #7CFF4F;
            box-shadow: 0 10px 25px rgba(124,255,79,.12);
        }

        .product-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 9px;
        }

        .product-name {
            color: white;
            overflow-wrap: anywhere;
        }

        .product-price {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .discount {
            display: inline-block;
            color: #7CFF4F;
            font-size: 12px;
            margin-left: 3px;
        }

        .view-btn {
            color: #050607;
            background: #7CFF4F;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .view-btn:hover {
            color: #050607;
            background: #69e83f;
        }

        @media (max-width: 575.98px) {
            .product-image {
                height: 110px;
            }

            .product-name {
                font-size: 13px;
            }

            .product-price {
                font-size: 12px;
            }

            .discount {
                font-size: 11px;
            }

            .view-btn {
                font-size: 12px;
                padding: 7px 4px;
            }

            .category-panel {
                padding: 10px !important;
            }
        }
    </style>

</section>
</body>
</html>
