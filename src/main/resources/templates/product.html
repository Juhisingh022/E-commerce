<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleof.org"
      th:replace="~{base:: Layout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

<section style="
    background:#050607;
    min-height:100vh;
    color:white;
    padding-bottom:50px;
">


    <!-- ================= SEARCH SECTION ================= -->

    <div class="container-fluid p-5 mt-5"
         style="
         background:#050607;
         padding-top:45px !important;
         ">

        <div class="row shadow p-3 mb-5 bg-body rounded"
             style="
             background:#101314 !important;
             border:1px solid #292d2f;
             border-radius:15px !important;
             box-shadow:0 10px 30px rgba(0,0,0,.35) !important;
             ">

            <div class="col-md-8 offset-md-2">

                <form action="">

                    <div class="input-group">

                        <input type="text"
                               class="form-control"
                               name="ch"
                               placeholder="Search products..."
                               style="
                               background:#080a0b;
                               color:white;
                               border:1px solid #353839;
                               border-radius:10px 0 0 10px;
                               padding:12px 15px;
                               "
                               onfocus="
                               this.style.borderColor='#7CFF4F';
                               this.style.boxShadow='0 0 0 0.15rem rgba(124,255,79,.10)';
                               "
                               onblur="
                               this.style.borderColor='#353839';
                               this.style.boxShadow='none';
                               ">

                        <button class="btn btn-dark ms-3 col-md-2"
                                style="
                                background:#7CFF4F;
                                color:#050607;
                                border:none;
                                border-radius:10px;
                                font-weight:600;
                                transition:all .3s ease;
                                "
                                onmouseover="
                                this.style.background='#9aff75';
                                this.style.transform='translateY(-2px)';
                                this.style.boxShadow='0 7px 18px rgba(124,255,79,.18)';
                                "
                                onmouseout="
                                this.style.background='#7CFF4F';
                                this.style.transform='translateY(0)';
                                this.style.boxShadow='none';
                                ">

                            <i class="fa-solid fa-magnifying-glass"></i>
                            Search

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
