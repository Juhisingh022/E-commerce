<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCart AI Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f0c;
            color: white;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            margin: 50px auto;
            background: #111713;
            border: 1px solid #292d2f;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(124,255,79,0.08);
        }

        .chat-header {
            padding: 20px;
            background: #151c17;
            border-bottom: 1px solid #292d2f;
        }

        .chat-header h2 {
            margin: 0;
            color: #7CFF4F;
        }

        .chat-header p {
            margin: 5px 0 0;
            color: #aaa;
            font-size: 13px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            max-width: 80%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 15px;
            line-height: 1.5;
        }

        .user-message {
            margin-left: auto;
            background: #7CFF4F;
            color: #000;
        }

        .ai-message {
            background: #202820;
            color: #fff;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #292d2f;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0b0f0c;
            color: white;
            outline: none;
        }

        .input-area button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #7CFF4F;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .input-area button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <h2>🤖 NovaCart AI</h2>
        <p>Your smart shopping assistant</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message ai-message">
            Hello! 👋 I'm NovaCart AI. How can I help you?
        </div>

    </div>

    <div class="input-area">

        <input
                type="text"
                id="question"
                placeholder="Ask me anything..."
                onkeydown="handleEnter(event)"
        >

        <button onclick="askAI()">Send</button>

    </div>

</div>

<script>

    function handleEnter(event) {
        if (event.key === "Enter") {
            askAI();
        }
    }

    async function askAI() {

        const input = document.getElementById("question");
        const question = input.value.trim();

        if (!question) {
            return;
        }

        const chatBox = document.getElementById("chatBox");

        // User message
        const userMessage = document.createElement("div");
        userMessage.className = "message user-message";
        userMessage.innerText = question;

        chatBox.appendChild(userMessage);

        input.value = "";

        // Loading message
        const loadingMessage = document.createElement("div");
        loadingMessage.className = "message ai-message";
        loadingMessage.innerText = "Thinking... 🤔";

        chatBox.appendChild(loadingMessage);

        chatBox.scrollTop = chatBox.scrollHeight;

        try {

            const response = await fetch(
                `/ai/ask?question=${encodeURIComponent(question)}`
            );

            if (!response.ok) {
                throw new Error("AI request failed");
            }

            const answer = await response.text();

            loadingMessage.innerText = answer;

        } catch (error) {

            loadingMessage.innerText =
                "Sorry, something went wrong. Please try again.";

            console.error(error);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

</script>

</body>
</html>
