
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base:: Layout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>

<body>

<section style="
    background:#050607;
    min-height:100vh;
    color:white;
    padding-top:20px;
">

    <div class="container mt-5 p-5">
        <div class="row">

            <!-- IMAGE -->
            <div class="col-md-6 mt-5 p-5">
                <img src="img/log.png"
                     alt=""
                     width="100%"
                     height="400px"
                     style="
                     object-fit:cover;
                     border-radius:18px;
                     border:1px solid #292d2f;
                     box-shadow:0 0 30px rgba(124,255,79,0.08);
                     ">
            </div>

            <!-- LOGIN CARD -->
            <div class="col-md-6 p-5">
                <div class="card shadow p-3 mb-5 bg-body rounded"
                     style="
                     background:#101314 !important;
                     color:white;
                     border:1px solid #292d2f;
                     border-radius:18px !important;
                     box-shadow:0 10px 35px rgba(0,0,0,0.45) !important;
                     ">

                    <!-- HEADER -->
                    <div class="card-header"
                         style="
                         background:#101314;
                         color:white;
                         border-bottom:1px solid #292d2f;
                         border-radius:14px 14px 0 0;
                         ">
                        <p class="fs-4 text-center"
                           style="margin-bottom:5px;font-weight:600;letter-spacing:1px;">
                            <span style="color:#7CFF4F;">✦</span>
                            Login
                            <span style="color:#7CFF4F;">✦</span>
                        </p>
                    </div>

                    <!-- BODY -->
                    <div class="card-body" style="background:#101314;">

                        <!-- ERROR MESSAGE -->
                        <div th:if="${error}"
                             class="alert alert-danger"
                             th:text="${error}">
                        </div>

                        <!-- SUCCESS MESSAGE -->
                        <div th:if="${success}"
                             class="alert alert-success"
                             th:text="${success}">
                        </div>

                        <form th:action="@{/login}" method="post">

                            <!-- EMAIL -->
                            <div class="mb-3">
                                <label for="exampleInputEmail1"
                                       class="form-label"
                                       style="color:#e8e8e8;font-size:14px;font-weight:500;">
                                    Email address
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       id="exampleInputEmail1"
                                       aria-describedby="emailHelp"
                                       required
                                       style="
                                       background:#080a0b;
                                       color:white;
                                       border:1px solid #353839;
                                       border-radius:9px;
                                       padding:11px 13px;
                                       "
                                       onfocus="this.style.borderColor='#7CFF4F';this.style.boxShadow='0 0 0 0.15rem rgba(124,255,79,.12)';"
                                       onblur="this.style.borderColor='#353839';this.style.boxShadow='none';">

                                <div id="emailHelp"
                                     class="form-text"
                                     style="color:#777;font-size:11px;margin-top:6px;">
                                    We'll never share your email with anyone else.
                                </div>
                            </div>

                            <!-- PASSWORD -->
                            <div class="mb-3">
                                <label for="exampleInputPassword1"
                                       class="form-label"
                                       style="color:#e8e8e8;font-size:14px;font-weight:500;">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       id="exampleInputPassword1"
                                       required
                                       style="
                                       background:#080a0b;
                                       color:white;
                                       border:1px solid #353839;
                                       border-radius:9px;
                                       padding:11px 13px;
                                       "
                                       onfocus="this.style.borderColor='#7CFF4F';this.style.boxShadow='0 0 0 0.15rem rgba(124,255,79,.12)';"
                                       onblur="this.style.borderColor='#353839';this.style.boxShadow='none';">
                            </div>

                            <!-- CHECKBOX -->
                            <div class="mb-3 form-check">
                                <input type="checkbox"
                                       class="form-check-input"
                                       id="exampleCheck1"
                                       style="background-color:#080a0b;border-color:#555;">

                                <label class="form-check-label"
                                       for="exampleCheck1"
                                       style="color:#bdbdbd;font-size:13px;">
                                    Check me out
                                </label>
                            </div>

                            <!-- SUBMIT -->
                            <button type="submit"
                                    class="form-control btn"
                                    style="
                                    background:#7CFF4F;
                                    color:#050607;
                                    border:none;
                                    border-radius:9px;
                                    padding:10px;
                                    font-size:15px;
                                    font-weight:600;
                                    letter-spacing:.4px;
                                    transition:all .3s ease;
                                    "
                                    onmouseover="this.style.background='#9aff75';this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 20px rgba(124,255,79,.18)';"
                                    onmouseout="this.style.background='#7CFF4F';this.style.transform='translateY(0)';this.style.boxShadow='none';">
                                Submit
                            </button>

                        </form>
                    </div>

                    <!-- FOOTER -->
                    <div class="card-footer text-center"
                         style="
                         background:#101314;
                         color:#aaa;
                         border-top:1px solid #292d2f;
                         border-radius:0 0 14px 14px;
                         font-size:13px;
                         ">

                        <a href="#"
                           class="text-decoration-none"
                           style="color:#7CFF4F;">
                            Forget Password
                        </a>

                        <br>

                        <span style="color:#999;">
                            Don't have an account?
                        </span>

                        <a th:href="@{/signup}"
                           class="text-decoration-none"
                           style="color:#7CFF4F;font-weight:500;">
                            Create Account
                        </a>

                        <br>
                    </div>

                </div>
            </div>

        </div>
    </div>

</section>

</body>
</html>
