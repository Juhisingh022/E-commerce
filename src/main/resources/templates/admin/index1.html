
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base:: Layout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>
<section>
    <div class="container p-5">

        <!-- WELCOME MESSAGE -->
        <p class="text-center fs-3 mt-4"
           th:if="${session.loggedInUser != null}">
            Welcome,
            <span th:text="${session.loggedInUser}">User Name</span>! 👋
        </p>

        <!-- DEFAULT HEADING -->
        <p class="text-center fs-3 mt-4"
           th:unless="${session.loggedInUser != null}">
            Admin Dashboard
        </p>

        <div class="row p-5">

            <div class="col-md-4 mt-2">
                <a href="/admin/loadAddProduct" class="text-decoration-none">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-body text-center text-primary">
                            <i class="fa-solid fa-square-plus fa-3x"></i>
                            <h4>Add Product</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4 mt-2">
                <a href="/admin/category" class="text-decoration-none">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-body text-center text-warning">
                            <i class="fa-solid fa-list fa-3x"></i>
                            <h4>Add Category</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4 mt-2">
                <a href="#" class="text-decoration-none">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-body text-center text-success">
                            <i class="fa-solid fa-table-list fa-3x"></i>
                            <h4>View Product</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4 mt-4">
                <a href="#" class="text-decoration-none">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-body text-center text-warning">
                            <i class="fa-solid fa-box-open fa-3x"></i>
                            <h4>Orders</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4 mt-4">
                <a href="#" class="text-decoration-none">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-body text-center text-primary">
                            <i class="fa-solid fa-circle-user fa-3x"></i>
                            <h4>Users</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4 mt-4">
                <a href="#" class="text-decoration-none">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-body text-center text-primary">
                            <i class="fa-solid fa-user-plus fa-3x"></i>
                            <h4>Add Admin</h4>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>
</section>
</body>
</html>
