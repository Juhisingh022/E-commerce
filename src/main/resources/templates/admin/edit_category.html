<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleof.org" 
     th:replace="~{base:: Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <div class="container-fluid p-5 mt-5">
            <div class="row">
                <div class="col-md-3">
                    <div class="card shadow p-3 mb-5 bg-body rounded">
                        <div class="card-header text-center fs-4"> 
                            Edit Category
                            <th:block th:if=" ${session.succMsg}">
                                 <p class="text-success fw-bold">
                                     [[${session.succMsg}]]
                                 </p>
                                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}">

                                </th:block>


                            </th:block>

                            <th:block th:if=" ${session.errorMsg}">
                                 <p class="text-danger fw-bold">
                                     [[${session.errorMsg}]]
                                 </p>
                                  <th:block th:text="${@commonServiceImpl.removeSessionMessage()}">

                                </th:block>
                            </th:block>


                        </div>
                        <div class="card-body">
                         <form action="/admin/saveCategory" method="POST" enctype="multipart/form-data">
                               <div class="mb-3">
                                <label class="form-label">Enter Category</label>
                                <input type="text" class="form-control" name="name">
                               </div>

                               <div class="mb-3">
                                <label class="form-label">Status</label>
                                <div class="form-check">
                                        <input class="form-check-input" type="radio" name="isActive" id="flexRadioDefault1" value =" true" checked>
                                        <label class="form-check-label" for="flexRadioDefault1">
                                            Active
                                        </label>
                                        </div>
                                        <div class="form-check">
                                        <input class="form-check-input" type="radio" name="isActive" id="flexRadioDefault2" value =" false" >
                                        <label class="form-check-label" for="flexRadioDefault2">
                                            Inactive
                                        </label>
                                  </div>
                               </div>


                               <div class="mb-3 col">
                                <label class="form-label">Upload Image</label>
                                <input type="file" class="form-control" name="file">
                               </div>
                             <button class="btn btn-primary col-md-12 mt-2">Save</button>
                         </form>
                         </div>
                    </div>
                  
                </div>
              
            </div>

        </div>
    </section>
</body>
</html>
