<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleof.org" th:fragment="Layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
     rel="stylesheet"
     integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
    crossorigin="anonymous">

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="css/style.css">
</head>
<body >
    <!-- Start nav bar-->
<nav class="navbar navbar-expand-lg navbar-light fixed-top navbar-dark"
     style="
     background:#050607;
     height:72px;
     padding:0 42px;
     box-shadow:0 4px 18px rgba(0,0,0,0.45);
     ">

    <div class="container-fluid"
         style="
         height:100%;
         padding:0;
         display:flex;
         align-items:center;
         ">

        <!-- ================= BRAND ================= -->

        <a class="navbar-brand"
           href="#"
           style="
           color:white;
           display:flex;
           flex-direction:column;
           justify-content:center;
           line-height:1;
           padding:0;
           margin:0;
           width:385px;
           text-decoration:none;
           ">

            <span style="
                font-size:28px;
                font-weight:600;
                letter-spacing:-1px;
                white-space:nowrap;
                line-height:1;
            ">

                <i class="fa-solid fa-cart-shopping"
                   style="
                   font-size:27px;
                   margin-right:8px;
                   color:white;
                   "></i>

                Nova<span style="color:#7CFF4F;">Cart</span>

            </span>


            <small style="
                font-size:8px;
                font-weight:500;
                letter-spacing:1px;
                color:white;
                opacity:0.7;
                margin-top:6px;
                margin-left:37px;
                white-space:nowrap;
            ">

                <span style="color:#7CFF4F;">—</span>
                &nbsp; A SMART ONLINE SHOPPING PLATFORM &nbsp;
                <span style="color:#7CFF4F;">—</span>

            </small>

        </a>


        <!-- ================= VERTICAL LINE ================= -->

        <div style="
            height:44px;
            width:1px;
            background:rgba(255,255,255,0.20);
            margin-right:38px;
        "></div>


        <!-- ================= TOGGLER ================= -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
                style="border:1px solid #444;">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">


            <!-- ================= MAIN MENU ================= -->

            <ul class="navbar-nav me-auto mb-2 mb-lg-0"
                style="
                display:flex;
                align-items:center;
                gap:18px;
                ">


                <!-- HOME -->

                <li class="nav-item">

                    <a class="nav-link active"
                       style="
                       color:#7CFF4F;
                       font-size:16px;
                       font-weight:500;
                       padding:8px 12px;
                       transition:all .3s ease;
                       "
                       aria-current="page"
                       href="/index"
                       onmouseover="
                       this.style.transform='translateY(-2px)';
                       this.style.color='#7CFF4F';
                       "
                       onmouseout="
                       this.style.transform='translateY(0)';
                       this.style.color='#7CFF4F';
                       ">

                        <i class="fa-solid fa-house"
                           style="margin-right:5px;"></i>Home

                    </a>

                </li>


                <!-- PRODUCT -->

                <li class="nav-item">

                    <a class="nav-link active"
                       style="
                       color:white;
                       font-size:16px;
                       font-weight:500;
                       padding:8px 12px;
                       transition:all .3s ease;
                       "
                       aria-current="page"
                       href="/product"
                       onmouseover="
                       this.style.transform='translateY(-2px)';
                       this.style.color='#7CFF4F';
                       "
                       onmouseout="
                       this.style.transform='translateY(0)';
                       this.style.color='white';
                       ">

                        <i class="fa-solid fa-bag-shopping"
                           style="margin-right:5px;"></i>Product

                    </a>

                </li>


                <!-- CATEGORY -->

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       style="
                       color:white;
                       font-size:16px;
                       font-weight:500;
                       padding:8px 12px;
                       transition:all .3s ease;
                       "
                       href="#"
                       id="navbarDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false"
                       onmouseover="
                       this.style.transform='translateY(-2px)';
                       this.style.color='#7CFF4F';
                       "
                       onmouseout="
                       this.style.transform='translateY(0)';
                       this.style.color='white';
                       ">

                        <i class="fa-solid fa-layer-group"
                           style="margin-right:5px;"></i>Category

                    </a>


                    <ul class="dropdown-menu"
                        aria-labelledby="navbarDropdown"
                        style="
                        background:#101112;
                        border:1px solid #303234;
                        border-radius:10px;
                        padding:7px;
                        ">

                        <li>

                            <a class="dropdown-item"
                               href="#"
                               style="
                               color:white;
                               font-size:14px;
                               border-radius:6px;
                               "
                               onmouseover="
                               this.style.color='#7CFF4F';
                               this.style.background='#1b1d1f';
                               "
                               onmouseout="
                               this.style.color='white';
                               this.style.background='transparent';
                               ">

                                Action

                            </a>

                        </li>


                        <li>

                            <a class="dropdown-item"
                               href="#"
                               style="
                               color:white;
                               font-size:14px;
                               border-radius:6px;
                               "
                               onmouseover="
                               this.style.color='#7CFF4F';
                               this.style.background='#1b1d1f';
                               "
                               onmouseout="
                               this.style.color='white';
                               this.style.background='transparent';
                               ">

                                Another action

                            </a>

                        </li>


                        <li>

                            <hr class="dropdown-divider"
                                style="border-color:#333;">

                        </li>


                        <li>

                            <a class="dropdown-item"
                               href="#"
                               style="
                               color:white;
                               font-size:14px;
                               border-radius:6px;
                               "
                               onmouseover="
                               this.style.color='#7CFF4F';
                               this.style.background='#1b1d1f';
                               "
                               onmouseout="
                               this.style.color='white';
                               this.style.background='transparent';
                               ">

                                Something else here

                            </a>

                        </li>

                    </ul>

                </li>

            </ul>


            <!-- ================= RIGHT MENU ================= -->

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0"
                style="
                display:flex;
                align-items:center;
                gap:8px;
                ">


                <!-- LOGIN -->

                <li class="nav-item">

                    <a class="nav-link active"
                       aria-current="page"
                       href="/login"
                       style="
                       color:white;
                       font-size:15px;
                       font-weight:500;
                       padding:8px 17px;
                       border:1px solid #3b3d3f;
                       border-radius:22px;
                       transition:all .3s ease;
                       white-space:nowrap;
                       "
                       onmouseover="
                       this.style.color='#7CFF4F';
                       this.style.borderColor='#7CFF4F';
                       "
                       onmouseout="
                       this.style.color='white';
                       this.style.borderColor='#3b3d3f';
                       ">

                        <i class="fa-solid fa-right-to-bracket"
                           style="margin-right:5px;"></i>Login

                    </a>

                </li>


                <!-- REGISTER -->

                <li class="nav-item">

                    <a class="nav-link active"
                       aria-current="page"
                       href="/signup"
                       style="
                       color:white;
                       font-size:15px;
                       font-weight:500;
                       padding:8px 17px;
                       border:1px solid #3b3d3f;
                       border-radius:22px;
                       transition:all .3s ease;
                       white-space:nowrap;
                       "
                       onmouseover="
                       this.style.color='#7CFF4F';
                       this.style.borderColor='#7CFF4F';
                       "
                       onmouseout="
                       this.style.color='white';
                       this.style.borderColor='#3b3d3f';
                       ">

                        <i class="fa-solid fa-user-plus"
                           style="margin-right:5px;"></i>Register

                    </a>

                </li>


                <!-- ADMIN -->

                <li class="nav-item">

                    <a class="nav-link active"
                       aria-current="page"
                       href="#"
                       style="
                       color:white;
                       font-size:15px;
                       font-weight:500;
                       padding:8px 17px;
                       border:1px solid #3b3d3f;
                       border-radius:22px;
                       transition:all .3s ease;
                       white-space:nowrap;
                       "
                       onmouseover="
                       this.style.color='#7CFF4F';
                       this.style.borderColor='#7CFF4F';
                       "
                       onmouseout="
                       this.style.color='white';
                       this.style.borderColor='#3b3d3f';
                       ">

                        <i class="fa-solid fa-user-shield"
                           style="margin-right:5px;"></i>Admin

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>
    <!-- End nav bar -->

    <div th:replace="${content}"> </div>
        <!-- start footer-  -->
          <div class="container-fluid p-1  text-center text-white" style="background-color: rgb(0, 0, 0);"> 
              <p>ecom.com @Shobhit Singh</p>
          </div>
        
        <!-- end footer -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
    crossorigin="anonymous">
    </script>
</body>
</html>
