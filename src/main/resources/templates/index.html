<!-- ================= START SLIDER ================= -->

<div id="carouselExampleFade"
     class="carousel slide carousel-fade"
     data-bs-ride="carousel"
     style="
     margin:0;
     overflow:hidden;
     background:#050607;
     box-shadow:0 10px 35px rgba(0,0,0,0.5);
     ">

    <div class="carousel-inner">

        <div class="carousel-item active">

            <img src="img/slide1.png"
                 class="d-block w-100"
                 alt="..."
                 height="700px"
                 style="
                 object-fit:cover;
                 filter:brightness(0.88);
                 ">

        </div>


        <div class="carousel-item">

            <img src="img/slide2.png"
                 class="d-block w-100"
                 alt="..."
                 height="700px"
                 style="
                 object-fit:cover;
                 filter:brightness(0.88);
                 ">

        </div>


        <div class="carousel-item">

            <img src="img/slide3.png"
                 class="d-block w-100"
                 alt="..."
                 height="700px"
                 style="
                 object-fit:cover;
                 filter:brightness(0.88);
                 ">

        </div>

    </div>


    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleFade"
            data-bs-slide="prev"
            style="width:8%;">

        <span class="carousel-control-prev-icon"
              aria-hidden="true"
              style="filter:drop-shadow(0 0 5px black);">
        </span>

        <span class="visually-hidden">Previous</span>

    </button>


    <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleFade"
            data-bs-slide="next"
            style="width:8%;">

        <span class="carousel-control-next-icon"
              aria-hidden="true"
              style="filter:drop-shadow(0 0 5px black);">
        </span>

        <span class="visually-hidden">Next</span>

    </button>

</div>

<style>
.latest-products-section {
    background: linear-gradient(180deg, #0b0d0e, #050607);
    padding: 45px 35px;
    border-top: 1px solid #1d2021;
    border-bottom: 1px solid #1d2021;
}

.latest-products-section::before {
    content: "✦ Latest Products ✦";
    display: block;
    color: white;
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: 1px;
    margin-bottom: 35px;
}

.category-link {
    display: block;
    height: 100%;
    text-decoration: none;
}

.category-card {
    height: 100%;
    background: #101314;
    border: 1px solid #292d2f;
    border-radius: 14px;
    color: white;
    transition: all .35s ease;
}

.category-card:hover {
    transform: translateY(-7px);
    border-color: #7CFF4F;
    box-shadow: 0 10px 30px rgba(124, 255, 79, .15);
}

.category-card .card-body {
    padding: 20px 10px;
}

.category-card img {
    width: 65%;
    height: 140px;
    object-fit: contain;
    border-radius: 10px;
}

.category-card p {
    color: white;
    font-weight: 500;
    margin: 15px 0 0;
}

@media (max-width: 576px) {
    .latest-products-section {
        padding: 30px 12px;
    }

    .latest-products-section::before {
        font-size: 22px;
        margin-bottom: 24px;
    }

    .category-card img {
        width: 90%;
        height: 115px;
    }

    .category-card .card-body {
        padding: 14px 6px;
    }

    .category-card p {
        font-size: 14px;
    }
}
</style>
